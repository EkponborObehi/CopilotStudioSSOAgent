<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Copilot Web Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.32.0/js/msal-browser.min.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="chatwindow">
    <div id="header">Copilot Web Chat</div>
    <div id="subheader">
      <span id="loginStatus">You are not logged in on the website.</span>
      <div>
        <a id="login" href="#" onclick="onSignInClick()">Sign in with Microsoft</a>
        <a id="logout" href="#"  style="display:none" onclick="onSignOutClick()">Sign out</a>
      </div>
    </div>
    <div id="webchat">
      <div class="fade-in">Loading chat...</div>
    </div>
  </div>
<script src="/assets/js/env.js"></script>
<script src="/assets/js/chat.js"></script>
</body>
</html>
